<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --front-bg: #0d0d0d;
      --front-accent: #c8a96e;
      --back-bg: #f5f0e8;
      --back-accent: #1a1a1a;
      --size: min(510px, 85vmin);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
      font-family: 'DM Sans', sans-serif;
      opacity: 0;
    }

    @keyframes bg-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Subtle grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    /* ── Scene / card wrapper ── */
    .scene {
      width: var(--size);
      height: var(--size);
      perspective: 900px;
      cursor: pointer;

      /* Hidden until JS triggers the animation after full load */
      opacity: 0;
    }

    .scene.animate {
      animation: roll-in 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes roll-in {
      from {
        opacity: 0.5;
        transform: translateX(calc(var(--size) * -0.25)) rotate(-30deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
    }

    /* ── Card (the flipping element) ── */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }

    .card.flipped {
      transform: rotateY(-180deg);
    }

    /* ── Shared face styles ── */
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── FRONT ── */
    .front {
      background: var(--front-bg);
      box-shadow:
        0 0 0 2px #2a2218,
        0 0 0 6px #1a1510,
        0 15px 50px rgba(0,0,0,0.35),
        inset 0 0 60px rgba(200,169,110,0.04);
    }

    /* Decorative ring */
    .front::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.25);
      pointer-events: none;
    }
    .front::after {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.1);
      pointer-events: none;
    }

    .front-content {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    .front-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--front-accent);
      margin-bottom: 14px;
      opacity: 0.8;
    }

    .front-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .front-title em {
      font-style: italic;
      color: var(--front-accent);
    }

    .front-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
    }

    /* Tap hint */
    .hint {
      position: absolute;
      bottom: 56px;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(200,169,110,0.4);
    }

    /* Decorative dot grid */
    .dot-grid {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0.07;
      background-image: radial-gradient(circle, #c8a96e 1px, transparent 1px);
      background-size: 18px 18px;
      pointer-events: none;
    }

    /* ── BACK ── */
    .back {
      background: var(--back-bg);
      transform: rotateY(-180deg);
      box-shadow:
        0 0 0 2px #ddd5c3,
        0 0 0 6px #e8e0d0,
        0 15px 50px rgba(0,0,0,0.13);
    }

    .back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(26,26,26,0.15);
      pointer-events: none;
    }

    .back-content {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    .back-label {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(26,26,26,0.4);
      margin-bottom: 16px;
    }

    .back-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 17px;
      color: var(--back-accent);
      line-height: 1.55;
      max-width: 200px;
      margin: 0 auto 16px;
    }

    .back-attr {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(26,26,26,0.4);
    }

    /* Subtle watermark circle on back */
    .back-ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 28px solid rgba(26,26,26,0.04);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="scene" id="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front">
      <div class="dot-grid"></div>
      <div class="front-content">
        <p class="front-eyebrow">Est. MMXXVI</p>
        <h1 class="front-title">The<br><em>Golden</em><br>Circle</h1>
        <p class="front-sub">Click to reveal</p>
      </div>
      <span class="hint">tap &nbsp;/&nbsp; click</span>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="back-ring"></div>
      <div class="back-content">
        <p class="back-label">Revealed</p>
        <p class="back-quote">"Not all those who wander are lost."</p>
        <p class="back-attr">— J.R.R. Tolkien</p>
      </div>
    </div>

  </div>
</div>

<script>
  const card = document.getElementById('card');
  const scene = document.getElementById('scene');

  window.addEventListener('load', () => {
    // 1. Fade in the background
    document.body.style.animation = 'bg-fade 0.6s ease forwards';

    // 2. After bg fade completes, roll the card in
    setTimeout(() => {
      scene.classList.add('animate');
    }, 600);
  });

  scene.addEventListener('click', () => {
    card.classList.toggle('flipped');
  });
</script>

</body>
</html>
