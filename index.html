<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --front-bg: #0d0d0d;
      --front-accent: #c8a96e;
      --back-bg: #f5f0e8;
      --back-accent: #1a1a1a;
      --size: min(510px, 85vmin);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
      font-family: 'Source Sans 3', sans-serif;
      opacity: 0;
    }

    @keyframes bg-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Subtle grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    /* ── Scene / card wrapper ── */
    .scene {
      width: var(--size);
      height: var(--size);
      perspective: 900px;
      cursor: pointer;

      /* Hidden until JS triggers the animation after full load */
      opacity: 0;
    }

    .scene.animate {
      animation: roll-in 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes roll-in {
      from {
        opacity: 0.5;
        transform: translateX(calc(var(--size) * -0.25)) rotate(-30deg);
      }
      to {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
    }

    /* ── Card (the flipping element) ── */
    .card {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }

    .card.flipped {
      transform: rotateY(-180deg);
    }

    /* ── Shared face styles ── */
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── FRONT ── */
    .front {
      background: var(--front-bg);
      box-shadow:
        0 0 0 2px #2a2218,
        0 0 0 6px #1a1510,
        0 15px 50px rgba(0,0,0,0.35),
        inset 0 0 60px rgba(200,169,110,0.04);
    }

    /* Decorative ring */
    .front::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.25);
      pointer-events: none;
    }
    .front::after {
      content: '';
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.1);
      pointer-events: none;
    }

    .front-content {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    .front-eyebrow {
      font-family: 'Source Sans 3', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--front-accent);
      margin-bottom: 14px;
      opacity: 0.8;
    }

    .front-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .front-title em {
      font-style: italic;
      color: var(--front-accent);
    }

    .front-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
    }

    /* Tap hint */
    .hint {
      position: absolute;
      bottom: 56px;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(200,169,110,0.4);
    }

    /* Decorative dot grid */
    .dot-grid {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      opacity: 0.07;
      background-image: radial-gradient(circle, #c8a96e 1px, transparent 1px);
      background-size: 18px 18px;
      pointer-events: none;
    }

    /* ── BACK ── */
    .back {
      background: var(--back-bg);
      transform: rotateY(-180deg);
      box-shadow:
        0 0 0 2px #ddd5c3,
        0 0 0 6px #e8e0d0,
        0 15px 50px rgba(0,0,0,0.13);
    }

    .back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(26,26,26,0.15);
      pointer-events: none;
    }

    .back-content {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    .back-label {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(26,26,26,0.4);
      margin-bottom: 16px;
    }

    .back-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 17px;
      color: var(--back-accent);
      line-height: 1.55;
      max-width: 200px;
      margin: 0 auto 16px;
    }

    .back-attr {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(26,26,26,0.4);
    }

    /* Subtle watermark circle on back */
    .back-ring {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 28px solid rgba(26,26,26,0.04);
      pointer-events: none;
    }


    /* ── Flip hint ── */
    @keyframes hint-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes hint-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .flip-hint {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: none;
      color: rgba(26,26,26,0.55);
      margin-bottom: 20px;
      opacity: 0;
      pointer-events: none;
    }

    .flip-hint.visible {
      animation: hint-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .flip-hint.hiding {
      animation: hint-out 0.4s ease forwards;
    }
    /* ── Language toggle ── */
    .lang-toggle {
      margin-top: 24px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      display: flex;
      gap: 0;
      align-items: center;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(26,26,26,0.4);
      user-select: none;
    }

    .lang-toggle.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .lang-toggle button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      padding: 4px 10px;
      color: rgba(26,26,26,0.35);
      transition: color 0.25s ease;
      text-transform: uppercase;
    }

    .lang-toggle button.active {
      color: rgba(26,26,26,0.85);
      font-weight: 500;
    }

    .lang-toggle .divider {
      color: rgba(26,26,26,0.2);
    }

    /* Back face language layers */
    .back-lang {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }

    .back-lang.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div style="display:flex; flex-direction:column; align-items:center;">
<div class="flip-hint" id="flip-hint">Click to flip</div>
<div class="scene" id="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front">
      <img src="FloatinFront.webp" alt="Front" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" />
      <span class="hint">tap &nbsp;/&nbsp; click</span>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="back-ring"></div>

      <!-- English -->
      <div class="back-lang" id="back-eng">
       <img src="FloatinBackEng.webp" alt="Back English" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" />
      </div>

      <!-- Japanese -->
      <div class="back-lang hidden" id="back-jp">
        <img src="FloatinBackJp.webp" alt="Back Japanese" style="width:100%; height:100%; object-fit:cover; border-radius:50%;" />
      </div>
    </div>

  </div>
</div>

<!-- Language toggle (appears below card when flipped) -->
<div class="lang-toggle" id="lang-toggle">
  <button id="btn-eng" class="active" onclick="setLang('eng')">ENG</button>
  <span class="divider">/</span>
  <button id="btn-jp" onclick="setLang('jp')">JP</button>
</div>
</div><!-- end column wrapper -->

<script>
  const card = document.getElementById('card');
  const scene = document.getElementById('scene');

  window.addEventListener('load', () => {
    // 1. Fade in the background
    document.body.style.animation = 'bg-fade 0.6s ease forwards';

    // 2. After bg fade completes, roll the card in
    setTimeout(() => {
      scene.classList.add('animate');
    }, 600);
  });

  let isFlipped = false;
  const langToggle = document.getElementById('lang-toggle');
  const flipHint = document.getElementById('flip-hint');
  let hintTimer = null;

  // Show hint after 5s if still on front
  hintTimer = setTimeout(() => {
    if (!isFlipped) flipHint.classList.add('visible');
  }, 5000);

  scene.addEventListener('click', () => {
    isFlipped = !isFlipped;
    card.classList.toggle('flipped', isFlipped);
    langToggle.classList.toggle('visible', isFlipped);

    if (isFlipped) {
      // Fade out hint if it's showing
      if (flipHint.classList.contains('visible')) {
        flipHint.classList.remove('visible');
        void flipHint.offsetWidth; // force reflow so animation restarts cleanly
        flipHint.classList.add('hiding');
      }
    }
  });

  function setLang(lang) {
    document.getElementById('back-eng').classList.toggle('hidden', lang !== 'eng');
    document.getElementById('back-jp').classList.toggle('hidden', lang !== 'jp');
    document.getElementById('btn-eng').classList.toggle('active', lang === 'eng');
    document.getElementById('btn-jp').classList.toggle('active', lang === 'jp');
  }
</script>

</body>
</html>
